<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Pedro Jesús Muñoz Cifuentes</title>

  <meta name="description" content="Esta página no existe. Pero hay una partida de Snake esperando.">
  <!-- Una 404 nunca debe indexarse -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d0d0d'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='28' font-weight='600' fill='%23ffffff' text-anchor='middle'%3Epj%3C/text%3E%3C/svg%3E">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=1">
</head>

<body>

  <div class="topbar" id="topbar">
    <div class="topbar-inner">
      <nav class="topnav" aria-label="Navegación principal">
        <a href="/" data-i18n="nav.profile">Perfil</a>
        <a href="/#proyectos" data-i18n="nav.projects">Proyectos</a>
        <a href="/#galeria" data-i18n="nav.gallery">Galería</a>
        <a href="/#contacto" data-i18n="nav.contact">Contacto</a>
      </nav>

      <div class="topbar-tools">
        <div class="lang-switch" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" aria-pressed="true" data-i18n-title="a11y.langES">ES</button>
          <button type="button" data-lang="en" aria-pressed="false" data-i18n-title="a11y.langEN">EN</button>
        </div>
        <button type="button" class="icon-btn" id="sfx-btn" aria-pressed="false" data-i18n-title="a11y.sound" title="Sonido">
          <svg class="sfx-on" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Z" /><path d="M16.5 8.5a5 5 0 0 1 0 7" />
          </svg>
          <svg class="sfx-off" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Z" /><path d="m17 10 4 4M21 10l-4 4" />
          </svg>
        </button>
        <button type="button" class="icon-btn" id="theme-btn" data-i18n-title="a11y.theme" title="Tema">
          <svg class="moon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
          <svg class="sun" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main>
    <section class="error-head">
      <div class="column">
        <h1 class="error-code">404</h1>
        <p class="prose" data-i18n="err.lead">
          Esta página no existe. O la escribiste mal, o la moví y no dejé nota.
          Ya que estás aquí, hay una partida esperándote.
        </p>
        <div class="error-actions">
          <a class="btn" href="/"><span data-i18n="err.home">Volver al inicio</span></a>
          <a class="btn-ghost" href="/#proyectos" data-i18n="err.projects">Ver proyectos</a>
        </div>
      </div>
    </section>

    <section class="arcade" aria-label="Garden Snake">
      <div class="console">

        <div class="console-screen">
          <canvas id="screen" width="320" height="320" data-hint="PULSA START"
            role="img" aria-label="Garden Snake: juego de la serpiente"></canvas>
        </div>

        <div class="console-brand">
          <span><b>Garden</b> Snake</span>
          <span>PJMC-404</span>
        </div>

        <div class="console-controls">
          <div class="dpad" role="group" aria-label="Dirección">
            <button type="button" class="up" data-dir="0,-1" aria-label="Arriba">W</button>
            <button type="button" class="left" data-dir="-1,0" aria-label="Izquierda">A</button>
            <button type="button" class="down" data-dir="0,1" aria-label="Abajo">S</button>
            <button type="button" class="right" data-dir="1,0" aria-label="Derecha">D</button>
          </div>
          <button type="button" class="action-btn" id="arcade-action">START</button>
        </div>

        <p class="console-hint" data-i18n="err.hint">Flechas o WASD · Desliza en móvil</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <span data-i18n="footer.rights">© 2026 Pedro Jesús Muñoz Cifuentes</span>
      <div class="footer-links">
        <a href="/" data-i18n="nav.profile">Perfil</a>
        <a href="/#contacto" data-i18n="nav.contact">Contacto</a>
      </div>
    </div>
  </footer>

  <script src="assets/sfx.js?v=1"></script>
  <script src="assets/i18n.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
  <script src="assets/arcade.js?v=1"></script>

</body>

</html>
